# On a tag X.Y.Z (or X.Y.Z-pre): run the tests (ci.yml), make the app bundle (scripts/bundle.sh: `roc bundle` of main.roc and lib/),
# check it (roc unbundle, roc build), publish the GitHub release with the bundle (Talon R-T10, R-DI4: one <hash>.tar.zst),
# then build the bundle from the published URL on a clean runner.
# Then build roc-cfw for 5 targets (job binaries), and attach the binaries, SHA256SUMS and a build attestation to the same release (job attach).
# The bundle is the main asset and is published first. A failed binary build does not undo it: the jobs binaries and attach come after the release.
name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

# The prefix of the binary assets: <prefix>-<target>[.exe]. Change it here only.
env:
  ASSET_PREFIX: roc-cfw

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      url: ${{ steps.make.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || [[ "$TAG" == 0.0.0* ]]; then
            echo "The tag must be X.Y.Z or X.Y.Z-pre, not 0.0.0: $TAG" >&2
            exit 1
          fi

      - name: Install the pinned compiler
        run: echo "ROC=$(scripts/get-roc.sh)" >> "$GITHUB_ENV"

      - name: Bundle
        id: make
        run: |
          scripts/bundle.sh dist | tee bundle.txt
          name=$(sed -n 's/^name: //p' bundle.txt)
          echo "asset=$(sed -n 's/^asset: //p' bundle.txt)" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name" >> "$GITHUB_OUTPUT"

      - name: Test the bundle
        run: scripts/test_bundle.sh '${{ steps.make.outputs.asset }}'

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.make.outputs.asset }}
          NAME: ${{ steps.make.outputs.name }}
          URL: ${{ steps.make.outputs.url }}
        run: |
          pre=()
          [[ "$TAG" == *-* ]] && pre=(--prerelease)
          sed -e "s|@TAG@|$TAG|g" \
              -e "s|@URL@|$URL|g" \
              -e "s|@NAME@|$NAME|g" \
              -e "s|@NIGHTLY@|$(tr -d '[:space:]' < .roc-version)|g" \
              .github/release-notes.md > notes.md
          gh release create "$TAG" "$ASSET" --title "$TAG" --notes-file notes.md --verify-tag "${pre[@]}"

  test-published:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned compiler
        run: echo "ROC=$(scripts/get-roc.sh)" >> "$GITHUB_ENV"

      - name: Build the published bundle
        env:
          URL: ${{ needs.release.outputs.url }}
        run: |
          mkdir download
          curl -fsSL -o "download/$(basename "$URL")" "$URL"
          scripts/test_bundle.sh "download/$(basename "$URL")"

  # The binaries use the same targets and names as the release of Talon. A failed target does not stop the other targets.
  binaries:
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x64musl, ext: '' }
          - { os: ubuntu-24.04, target: arm64musl, ext: '' }
          - { os: macos-latest, target: x64mac, ext: '' }
          - { os: macos-latest, target: arm64mac, ext: '' }
          - { os: windows-latest, target: x64win, ext: '.exe' }
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned compiler
        run: echo "ROC=$(scripts/get-roc.sh)" >> "$GITHUB_ENV"

      - name: Name of the asset
        run: echo "ASSET=$ASSET_PREFIX-${{ matrix.target }}${{ matrix.ext }}" >> "$GITHUB_ENV"

      - name: Build
        run: '"$ROC" build --no-cache --opt=speed --target=${{ matrix.target }} --output="$ASSET" main.roc'

      # Only a binary that runs on this runner can run here. The other targets are checked by file size only.
      - name: Run the binary
        if: (matrix.os == 'ubuntu-24.04' && matrix.target == 'x64musl') || (matrix.os == 'macos-latest' && matrix.target == 'arm64mac') || matrix.target == 'x64win'
        run: ./$ASSET help | grep -q '^usage:'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # Attach the binaries that were built. This job runs when some targets failed. It does nothing when no target was built.
  attach:
    needs: [release, binaries]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          shopt -s nullglob
          cd dist
          files=("$ASSET_PREFIX"-*)
          if [ ${#files[@]} -eq 0 ]; then echo "::warning::No binary was built: the release has the bundle only."; exit 0; fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest
        if: hashFiles('dist/SHA256SUMS') != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ env.ASSET_PREFIX }}-*

      - name: Attach to the release
        if: hashFiles('dist/SHA256SUMS') != ''
        env:
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/"$ASSET_PREFIX"-* dist/SHA256SUMS -R "$GITHUB_REPOSITORY"
