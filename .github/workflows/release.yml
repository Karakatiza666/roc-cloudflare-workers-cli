# On a tag X.Y.Z (or X.Y.Z-pre) only. The run is the one run that Talon checks (R-PT17 to R-PT24): its source ref is refs/tags/<tag>,
# and the bundle and the binaries are attested in it, on GitHub-hosted runners. There is no workflow_dispatch: a run on a branch
# would give the source ref refs/heads/<branch>, and Talon would reject it.
# Flow: tests (ci.yml) -> bundle (scripts/bundle.sh, checked with scripts/test_bundle.sh) -> binaries (5 targets, in parallel)
#       -> publish (SHA256SUMS, attestation of the bundle and the binaries, ONE `gh release create` with all assets) -> test-published.
# A binary asset is <hash>-<target> (<hash>-x64win.exe on Windows): <hash> is the name of the bundle without .tar.zst (Talon R-PT17).
# A failed binary target does not block the bundle: publish runs with the targets that were built.
name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  bundle:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      name: ${{ steps.make.outputs.name }}
      hash: ${{ steps.make.outputs.hash }}
      url: ${{ steps.make.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || [[ "$TAG" == 0.0.0* ]]; then
            echo "The tag must be X.Y.Z or X.Y.Z-pre, not 0.0.0: $TAG" >&2
            exit 1
          fi

      - name: Install the pinned compiler
        run: echo "ROC=$(scripts/get-roc.sh)" >> "$GITHUB_ENV"

      - name: Bundle
        id: make
        run: |
          scripts/bundle.sh dist | tee bundle.txt
          name=$(sed -n 's/^name: //p' bundle.txt)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "hash=${name%.tar.zst}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name" >> "$GITHUB_OUTPUT"

      - name: Test the bundle
        run: scripts/test_bundle.sh "dist/${{ steps.make.outputs.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/${{ steps.make.outputs.name }}
          if-no-files-found: error

  # The names and targets are those of the release of Talon. A failed target does not stop the other targets.
  binaries:
    needs: bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x64musl, ext: '' }
          - { os: ubuntu-24.04, target: arm64musl, ext: '' }
          - { os: macos-latest, target: x64mac, ext: '' }
          - { os: macos-latest, target: arm64mac, ext: '' }
          - { os: windows-latest, target: x64win, ext: '.exe' }
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      # The asset name: <hash>-<target>[.exe]. Change the form here only.
      ASSET: ${{ needs.bundle.outputs.hash }}-${{ matrix.target }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned compiler
        run: echo "ROC=$(scripts/get-roc.sh)" >> "$GITHUB_ENV"

      - name: Build
        run: '"$ROC" build --no-cache --opt=speed --target=${{ matrix.target }} --output="$ASSET" main.roc'

      # Only a binary that can run on its runner is run. The other targets are not run.
      - name: Run the binary
        if: (matrix.os == 'ubuntu-24.04' && matrix.target == 'x64musl') || (matrix.os == 'macos-latest' && matrix.target == 'arm64mac') || matrix.target == 'x64win'
        run: ./"$ASSET" help | grep -q '^usage:'

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # One release with all assets. It runs when some targets failed, and then the release has only the targets that were built.
  publish:
    needs: [bundle, binaries]
    if: ${{ !cancelled() && needs.bundle.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      NAME: ${{ needs.bundle.outputs.name }}
      URL: ${{ needs.bundle.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # For people. Talon reads no checksum file (R-PT17): it compares the sha256 with the digest of the GitHub asset.
      - name: Checksums
        run: |
          cd dist
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # The bundle and each binary are subjects of the attestation, made in this run at the tag commit (Talon R-PT20).
      - name: Attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.zst
            dist/*-x64musl
            dist/*-arm64musl
            dist/*-x64mac
            dist/*-arm64mac
            dist/*-x64win.exe

      - name: Publish
        run: |
          pre=()
          [[ "$TAG" == *-* ]] && pre=(--prerelease)
          sed -e "s|@TAG@|$TAG|g" \
              -e "s|@URL@|$URL|g" \
              -e "s|@NAME@|$NAME|g" \
              -e "s|@NIGHTLY@|$(tr -d '[:space:]' < .roc-version)|g" \
              .github/release-notes.md > notes.md
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag "${pre[@]}"

  test-published:
    needs: [bundle, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned compiler
        run: echo "ROC=$(scripts/get-roc.sh)" >> "$GITHUB_ENV"

      - name: Build the published bundle
        env:
          URL: ${{ needs.bundle.outputs.url }}
        run: |
          mkdir download
          curl -fsSL -o "download/$(basename "$URL")" "$URL"
          scripts/test_bundle.sh "download/$(basename "$URL")"
